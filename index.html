<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | Cloud-Based StudyVault</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="logo">🌻 StudyVault</div>
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search notes...">
    <div class="nav-right">
      <span id="userName">👤</span>
      <button class="btn-logout" onclick="logoutUser()">Logout</button>
    </div>
  </nav>

  <main class="container">
    <h1 class="welcome" id="welcomeText">Welcome back! 🌻</h1>

    <!-- SUBJECT FILTER -->
    <div class="chips" id="chips"></div>

    <!-- NOTES -->
    <div class="section-head"><h2>💌 My Notes</h2></div>
    <div class="grid" id="notesGrid"></div>

    <!-- RESOURCES -->
    <section class="resources-section">
      <div class="section-head"><h2>🌼 Resources</h2></div>
      <form class="resource-form" id="resourceForm">
        <input type="text" id="resTitle" placeholder="Title" required>
        <input type="url" id="resUrl" placeholder="https://..." required>
        <select id="resSubject"></select>
        <button type="submit">Add</button>
      </form>
      <ul class="resource-list" id="resourceList"></ul>
    </section>
  </main>

  <button class="fab" onclick="openNoteModal()">🌻 Add Note</button>

  <!-- NOTE MODAL -->
  <div class="modal" id="noteModal">
    <div class="modal-box">
      <h2 id="modalTitle">New Note</h2>
      <input type="text" id="noteTitle" placeholder="Title">
      <select id="noteSubject"></select>
      <textarea id="noteContent" placeholder="Write your note..."></textarea>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeNoteModal()">Cancel</button>
        <button onclick="saveNote()">Save</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
